<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Apple PWA ve Safari Tam Ekran Meta Etiketleri -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HAMZACHAT">
    
    <title>HAMZACHAT // Firebase Pager</title>
    
    <!-- Harici Manifest Bağlantısı -->
    <link rel="manifest" href="/manifest.json">

    <!-- Firebase SDK (Compat - CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pastel-bg: #EFECE6;        
            --pastel-card: #F7F5F0;      
            --pastel-accent: #A8BBA2;    
            --text-dark: #383734;
            --text-muted: #7C7A75;
            --border-soft: rgba(56, 55, 52, 0.08);
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body {
            background-color: var(--pastel-bg);
            color: var(--text-dark);
            font-family: var(--font-sans);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0.25rem;
            overflow: hidden;
        }

        .pastel-card {
            background-color: var(--pastel-card);
            border: 1px solid var(--border-soft);
            box-shadow: 0 8px 24px rgba(56, 55, 52, 0.04);
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="select-none">

    <div class="w-full max-w-md h-[90vh] max-h-[680px] flex flex-col gap-1.5 relative overflow-hidden p-1.5">
        
        <!-- ÜST BİLGİ & BİLDİRİM ÇUBUĞU -->
        <div class="pastel-card rounded-xl px-2.5 py-1.5 flex justify-between items-center text-xs z-10">
            <div class="flex items-center gap-2">
                <span id="led-indicator" class="w-2.5 h-2.5 rounded-full bg-stone-400"></span>
                <div class="flex flex-col">
                    <div class="flex items-center gap-1">
                        <span id="my-identity" onclick="copyMyId()" class="font-mono font-bold text-[var(--text-dark)] cursor-pointer" title="ID Kopyala">Yükleniyor...</span>
                    </div>
                    <span id="net-status" class="text-[9px] text-[var(--text-muted)]">ÇEVRİMDIŞI</span>
                </div>
            </div>
            
            <div class="flex items-center gap-1">
                <button onclick="requestNotificationPermission()" title="Bildirim İzni" class="p-1.5 rounded-lg bg-amber-100 hover:bg-amber-200 text-amber-800 transition border border-amber-300">
                    <i class="fa-solid fa-bell text-[11px]"></i>
                </button>
                <button onclick="clearCloudMessages()" title="Temizle" class="p-1.5 rounded-lg bg-white/60 hover:bg-white hover:text-red-500 transition border border-[var(--border-soft)]">
                    <i class="fa-solid fa-trash text-[11px]"></i>
                </button>
            </div>
        </div>

        <!-- ANA PAGER EKRANI -->
        <div class="pastel-card rounded-2xl p-2.5 flex-1 flex flex-col justify-between gap-2 overflow-hidden relative">
            
            <div class="flex justify-between items-center px-1 py-0.5 border-b border-[var(--border-soft)] text-xs">
                <div class="flex items-center gap-1">
                    <i class="fa-solid fa-pager text-[var(--pastel-accent)]"></i>
                    <span class="font-semibold text-[var(--text-dark)]">PAGER // FIREBASE READY</span>
                </div>
                <div class="flex items-center gap-2 font-mono text-[10px] text-[var(--text-muted)]">
                    <span id="net-label">BULUT BAĞLI</span>
                </div>
            </div>

            <!-- MESAJ AKIŞ ALANI -->
            <div id="chat-messages" class="flex-1 overflow-y-auto hide-scrollbar flex flex-col gap-2 pr-0.5 justify-end"></div>

            <!-- MESAJ GİRİŞ FORMU -->
            <div class="flex flex-col gap-1 pt-1 border-t border-[var(--border-soft)]">
                <form id="chat-form" onsubmit="handleFormSubmit(event)" class="flex items-center gap-1.5">
                    <input type="text" id="chat-input" placeholder="Pager mesajı girin..." autocomplete="off"
                           class="flex-1 bg-white border border-[var(--border-soft)] rounded-xl py-2 px-3 text-xs text-[var(--text-dark)] placeholder-[var(--text-muted)] focus:outline-none focus:ring-1 focus:ring-[var(--pastel-accent)] transition shadow-xs" />
                    
                    <button type="submit" class="w-9 h-9 rounded-xl bg-[var(--pastel-accent)] hover:opacity-90 text-[var(--text-dark)] flex items-center justify-center transition active:scale-95 flex-shrink-0 shadow-sm">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Verilen Firebase Konfigürasyonu (pagertrk)
        const firebaseConfig = {
            apiKey: "AIzaSyCbUororrfe0QulrSrxaWONdOhkHaTtIBs",
            authDomain: "pagertrk.firebaseapp.com",
            databaseURL: "https://pagertrk-default-rtdb.firebaseio.com",
            projectId: "pagertrk",
            storageBucket: "pagertrk.firebasestorage.app",
            messagingSenderId: "151073272542",
            appId: "1:151073272542:web:7ef74267da5bf3f128884f",
            measurementId: "G-3X4R8ST9PM"
        };

        // Firebase Başlatma
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let soundEnabled = true;
        let myIdShort = Math.random().toString(36).substring(2, 6).toUpperCase();
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playPagerAlert() {
            if (!soundEnabled) return;
            initAudio();
            try {
                const now = audioCtx.currentTime;
                [0, 0.12, 0.24].forEach(offset => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(2000, now + offset);
                    gain.gain.setValueAtTime(0.06, now + offset);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.06);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + offset);
                    osc.stop(now + offset + 0.06);
                });
            } catch (e) {}
        }

        function requestNotificationPermission() {
            initAudio();
            if ('Notification' in window) {
                Notification.requestPermission().then(permission => {
                    alert(permission === 'granted' ? 'Bildirimler aktif!' : 'Bildirim izni reddedildi.');
                });
            }
        }

        function triggerSystemNotification(title, bodyText) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, { body: bodyText, icon: 'https://cdn-icons-png.flaticon.com/512/3602/3602145.png' });
            }
        }

        function copyMyId() { 
            navigator.clipboard.writeText(myIdShort).then(() => alert(`Kimlik ID: ${myIdShort}`)); 
        }

        // --- FIREBASE VERİTABANI İŞLEMLERİ ---

        // Firebase'den Mesajları Canlı Dinle
        db.ref('messages').on('child_added', (snapshot) => {
            const msg = snapshot.val();
            renderMessage(msg);
            
            // Eğer gelen mesaj başkasından ise ses çal ve bildirim ver
            if (msg.sender !== myIdShort) {
                playPagerAlert();
                triggerSystemNotification(`PAGER // ${msg.sender}`, msg.text);
            }
        });

        function handleFormSubmit(e) {
            e.preventDefault();
            initAudio();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            const msgObj = {
                id: 'msg_' + Date.now(),
                sender: myIdShort,
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            // Mesajı Firebase Bulutuna Kaydet
            db.ref('messages').push(msgObj);
            input.value = '';
        }

        function clearCloudMessages() {
            if (confirm("Tüm mesaj geçmişi silinsin mi?")) {
                db.ref('messages').remove();
                document.getElementById('chat-messages').innerHTML = '';
            }
        }

        function renderMessage(m) {
            const container = document.getElementById('chat-messages');
            const isMe = m.sender === myIdShort;
            const msgEl = document.createElement('div');
            msgEl.className = `flex flex-col gap-0.5 max-w-[85%] ${isMe ? 'self-end items-end' : 'self-start items-start'}`;
            msgEl.innerHTML = `
                <div class="text-[9px] text-[var(--text-muted)] px-1 font-mono"><b>${m.sender}</b> ${m.time}</div>
                <div class="px-3 py-2 rounded-xl text-xs shadow-xs border border-[var(--border-soft)] ${isMe ? 'bg-[var(--pastel-accent)] rounded-tr-none' : 'bg-white rounded-tl-none'}">
                    ${m.text}
                </div>
            `;
            container.appendChild(msgEl);
            container.scrollTop = container.scrollHeight;
        }

        window.onload = () => {
            document.getElementById('my-identity').innerText = `ID: ${myIdShort}`;
            const led = document.getElementById('led-indicator');
            const netStatus = document.getElementById('net-status');
            
            led.className = "w-2.5 h-2.5 rounded-full bg-[var(--pastel-accent)] animate-pulse";
            netStatus.innerText = "SİNYAL (BULUT)";

            document.body.addEventListener('click', () => initAudio(), { once: true });
        };
    </script>
</body>
</html>
